<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon portefeuille — Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app"><div class="eyebrow">Espace personnel</div><h1>Bonjour <span id="userName">…</span></h1><section class="card balance-card"><span class="muted">Solde disponible</span><div class="balance">•••••• XAF</div><button id="eye" class="button secondary">Afficher le solde</button></section><div class="actions"><a class="button" href="/recharger.html">Recharger</a><a class="button secondary" href="/envoyer.html">Envoyer</a><a class="button ghost" href="/recevoir.html">Recevoir</a></div><section class="card"><h2>Dernières opérations</h2><p class="error" aria-live="polite"></p><div class="operations"></div></section></main><nav class="site-nav" data-site-nav></nav><script src="/app.js"></script><script>(async()=>{try{const user=await guardAuth();userName.textContent=user.nom;await loadWallet(false)}catch(error){if(error.status!==401)showError(error)}})();let visible=false;eye.onclick=async()=>{visible=!visible;eye.textContent=visible?'Masquer le solde':'Afficher le solde';if(visible)await loadWallet(true);else document.querySelector('.balance').textContent='•••••• XAF'}</script></body></html>
