<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app narrow"><p class="eyebrow">Nexora Pay</p><h1>Créer votre compte</h1><p class="lead">Quelques informations suffisent pour commencer.</p><form id="form" class="card" novalidate><label for="nom">Nom complet</label><input id="nom" name="nom" minlength="2" maxlength="100" required><label for="pays">Pays</label><select id="pays" name="pays" data-countries required></select><label for="telephone">Téléphone</label><input id="telephone" name="telephone" inputmode="tel" autocomplete="tel" placeholder="66 12 34 56" required><p class="help">8 chiffres, sans le 0 initial. Exemple : 66 12 34 56</p><label for="email">Email <span class="help">(facultatif)</span></label><input id="email" name="email" type="email" autocomplete="email"><label for="password">Mot de passe</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label class="terms"><input id="terms" name="terms" type="checkbox" required><span>J’accepte les conditions d’utilisation provisoires.</span></label><p class="error" aria-live="polite"></p><button id="submit" class="button full" type="submit">Créer mon compte</button></form><p class="help">Vous avez déjà un compte ? <a href="/connexion.html">Se connecter</a></p></main><script src="/app.js"></script><script>document.getElementById("form").onsubmit=async event=>{event.preventDefault();const button=$('#submit');const error=$('.error');error.textContent='';if(!document.getElementById("terms").checked){error.textContent='Veuillez accepter les conditions';return}if(cleanPhone(document.getElementById("telephone").value).length!==8||!/^[67]/.test(cleanPhone(document.getElementById("telephone").value))){error.textContent='Le numéro doit contenir 8 chiffres sans le 0, commençant par 6 ou 7';return}if(document.getElementById("password").value.length<8){error.textContent='Le mot de passe doit contenir au moins 8 caractères';return}button.disabled=true;button.textContent='Création du compte…';try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({nom:document.getElementById("nom").value.trim(),pays:document.getElementById("pays").value,telephone:cleanPhone(document.getElementById("telephone").value),email:document.getElementById("email").value.trim()||undefined,password:document.getElementById("password").value,terms:'on'})});location='/portefeuille.html'}catch(error){showError(error);button.disabled=false;button.textContent='Créer mon compte'}}</script></body></html>
