<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app narrow"><p class="eyebrow">Nexora Pay</p><h1>Créer votre compte</h1><p class="lead">Quelques informations suffisent pour commencer.</p><form id="form" class="card" novalidate><label for="nom">Nom complet</label><input id="nom" name="nom" minlength="2" maxlength="100" required><label for="pays">Pays</label><select id="pays" name="pays" data-countries required></select><label for="telephone">Téléphone</label><input id="telephone" name="telephone" inputmode="tel" autocomplete="tel" placeholder="66 12 34 56" required><p class="help">8 chiffres, sans le 0 initial. Exemple : 66 12 34 56</p><label for="email">Email <span class="help">(facultatif)</span></label><input id="email" name="email" type="email" autocomplete="email"><label for="password">Mot de passe</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label class="terms"><input id="terms" name="terms" type="checkbox" required><span>J’accepte les conditions d’utilisation provisoires.</span></label><p class="error" role="alert" aria-live="assertive"></p><button id="submit" class="button full" type="submit">Créer mon compte</button></form><p class="help">Vous avez déjà un compte ? <a href="/connexion.html">Se connecter</a></p></main><script src="/app.js"></script></body></html>
