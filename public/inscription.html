<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription · Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><div class="brand"><span class="mark">N</span> Créer un compte</div><form id="form" class="card"><label>Nom complet<input name="nom" required minlength="2"></label><label>Pays<select name="pays" data-countries required></select></label><label>Numéro local<input name="telephone" inputmode="numeric" required></label><label>Email <span class="muted">(facultatif)</span><input name="email" type="email"></label><label>Mot de passe<input name="password" type="password" minlength="8" required></label><label><input name="terms" type="checkbox" required> J'accepte les conditions d'utilisation provisoires.</label><p class="error"></p><button class="button">Continuer</button></form><a class="muted" href="/connexion.html">J'ai déjà un compte</a></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(form));await api('/api/auth/register',{method:'POST',body:JSON.stringify(x)});location='/portefeuille.html'}catch(e){showError(e)}}</script></body></html>
