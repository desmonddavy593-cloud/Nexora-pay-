<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envoyer — Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app narrow"><div class="eyebrow">Transfert interne</div><h1>Envoyer de l’argent</h1><section id="lookupStep" class="card"><h2>1. Destinataire</h2><label>Pays<select id="pays" data-countries></select></label><label>Numéro local<input id="telephone" inputmode="tel" placeholder="66 12 34 56"></label><p class="help">Saisissez 8 chiffres sans le 0 initial.</p><p class="error"></p><button id="lookup" class="button full">Vérifier le destinataire</button></section><section id="transferStep" class="card hidden"><h2>2. Confirmer l’envoi</h2><p>Destinataire : <strong id="recipient"></strong></p><p>Solde disponible : <strong id="available"></strong></p><label>Montant (XAF)<input id="amount" type="number" min="100"></label><label>Motif <span class="help">(facultatif)</span><input id="reason"></label><div id="summary" class="notice hidden"></div><label>Mot de passe<input id="password" type="password"></label><p class="error"></p><button id="confirm" class="button full">Confirmer l’envoi</button></section></main><nav class="site-nav" data-site-nav></nav><script src="/app.js"></script><script>let recipientId='';let balance=0;(async()=>{try{const user=await guardAuth();const wallet=await loadWallet(false);balance=wallet.solde;document.getElementById("available").textContent=formatXaf(balance)}catch(error){}})();document.getElementById("lookup").onclick=async()=>{try{const data=await api('/api/transfers/lookup',{method:'POST',body:JSON.stringify({pays:document.getElementById("pays").value,telephone:cleanPhone(document.getElementById("telephone").value)})});recipientId=data.recipient.id;document.getElementById("recipient").textContent=data.recipient.nom;document.getElementById("lookupStep").classList.add('hidden');document.getElementById("transferStep").classList.remove('hidden')}catch(error){showError(error,lookupStep.querySelector('.error'))}};document.getElementById("amount").oninput=()=>{const value=Number(document.getElementById("amount").value||0);const fee=Math.max(100,Math.ceil(value*.01));document.getElementById("summary").textContent=value?`Vous envoyez ${formatXaf(value)}. Frais : ${formatXaf(fee)}. Total débité : ${formatXaf(value+fee)}.`:'';document.getElementById("summary").classList.toggle('hidden',!value)};document.getElementById("confirm").onclick=async()=>{try{await api('/api/transfers',{method:'POST',body:JSON.stringify({recipientId,amount:Number(document.getElementById("amount").value),password:document.getElementById("password").value})});location='/portefeuille.html'}catch(error){showError(error,transferStep.querySelector('.error'))}};</script></body></html>
