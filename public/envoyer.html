<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envoyer · Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><div class="brand"><span class="mark">N</span> Envoyer</div><form id="form" class="card"><label>Pays du destinataire<select name="pays" data-countries required></select></label><label>Numéro local<input name="telephone" required></label><button type="button" class="button secondary" id="lookup">Vérifier le destinataire</button><p id="recipient" class="success"></p><label>Montant (XAF)<input name="amount" type="number" min="100" required></label><label>Motif facultatif<input name="reason"></label><label>Mot de passe pour confirmer<input name="password" type="password" required></label><p class="muted">Les frais sont calculés avant confirmation. Minimum : 100 XAF.</p><p class="error"></p><button class="button">Confirmer l'envoi</button></form></main><script src="/app.js"></script><script>let recipientId;lookup.onclick=async()=>{try{const x=await api('/api/transfers/lookup',{method:'POST',body:JSON.stringify({pays:form.pays.value,telephone:form.telephone.value})});recipientId=x.recipient.id;recipient.textContent=`Destinataire : ${x.recipient.nom}`}catch(e){showError(e)}};form.onsubmit=async e=>{e.preventDefault();try{await api('/api/transfers',{method:'POST',body:JSON.stringify({recipientId,amount:Number(form.amount.value),password:form.password.value})});location='/portefeuille.html'}catch(e){showError(e)}}</script></body></html>
