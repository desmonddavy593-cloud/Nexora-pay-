<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envoyer — Nexora Pay</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app narrow"><div class="eyebrow">Transfert interne</div><h1>Envoyer de l’argent</h1><section id="lookupStep" class="card"><h2>1. Destinataire</h2><label>Pays<select id="pays" data-countries></select></label><label>Numéro local<input id="telephone" inputmode="tel" placeholder="66 12 34 56"></label><p class="help">Saisissez 8 chiffres sans le 0 initial.</p><p class="error" role="alert"></p><button id="lookup" class="button full" type="button">Vérifier le destinataire</button></section><section id="transferStep" class="card hidden"><h2>2. Confirmer l’envoi</h2><p>Destinataire : <strong id="recipient"></strong></p><p>Solde disponible : <strong id="available"></strong></p><label>Montant (XAF)<input id="amount" type="number" min="100"></label><label>Motif <span class="help">(facultatif)</span><input id="reason"></label><div id="summary" class="notice hidden"></div><label>Mot de passe<input id="password" type="password" autocomplete="current-password"></label><p class="error" role="alert"></p><button id="confirm" class="button full" type="button">Confirmer l’envoi</button></section></main><nav class="site-nav" data-site-nav></nav><script src="/app.js?v=20261027" defer></script></body></html>
