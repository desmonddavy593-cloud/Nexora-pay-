<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recharger · Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><div class="brand"><span class="mark">N</span> Recharger</div><form id="form" class="card"><label>Numéro Mobile Money<input id="msisdn" value="Votre numéro de compte" disabled></label><label>Opérateur<select name="paymentSystem"><option value="SIMU">SIMU LAB</option><option value="airtelmoney">Airtel Money</option><option value="moovmoney4">Moov Money</option></select></label><label>Montant (XAF)<input name="amount" type="number" min="100" required></label><p class="muted">Le solde n'augmente qu'après confirmation opérateur.</p><p class="error"></p><button class="button">Lancer la recharge</button></form></main><script src="/app.js"></script><script>api('/api/me').then(x=>{msisdn.value=x.user.telephone_international;const local=x.user.telephone_international.replace(/^\+\d{3}/,'');if(local.startsWith('7'))form.paymentSystem.value='airtelmoney';if(local.startsWith('6'))form.paymentSystem.value='moovmoney4'}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/recharges',{method:'POST',body:JSON.stringify({amount:Number(form.amount.value),paymentSystem:form.paymentSystem.value})});form.innerHTML=`<p class="success">${x.message}</p><p>Référence : ${x.reference}</p>`}catch(e){showError(e)}}</script></body></html>
