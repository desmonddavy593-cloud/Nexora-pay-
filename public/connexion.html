<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Se connecter — Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header" data-site-header></header><main class="app narrow"><p class="eyebrow">Bon retour</p><h1>Se connecter</h1><form id="form" class="card" novalidate><label for="pays">Pays</label><select id="pays" name="pays" data-countries required></select><label for="telephone">Téléphone</label><input id="telephone" name="telephone" inputmode="tel" placeholder="66 12 34 56" required><p class="help">8 chiffres, sans le 0 initial. Exemple : 66 12 34 56</p><label for="password">Mot de passe</label><input id="password" name="password" type="password" required><p class="error" aria-live="polite"></p><button id="submit" class="button full">Se connecter</button><a class="help" href="#" onclick="alert('La récupération du mot de passe sera bientôt disponible.');return false">Mot de passe oublié ?</a></form><p class="help">Pas encore de compte ? <a href="/inscription.html">Créer un compte</a></p></main><script src="/app.js"></script><script>form.onsubmit=async event=>{event.preventDefault();const button=$('#submit');const error=$('.error');error.textContent='';button.disabled=true;button.textContent='Connexion…';try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({pays:pays.value,telephone:cleanPhone(telephone.value),password:password.value})});location='/portefeuille.html'}catch(error){showError(error);button.disabled=false;button.textContent='Se connecter'}}</script></body></html>
