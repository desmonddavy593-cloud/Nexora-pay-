<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · Nexora Pay</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><div class="brand"><span class="mark">N</span> Connexion</div><form id="form" class="card"><label>Mode<select id="mode"><option value="phone">Téléphone</option><option value="email">Email</option></select></label><div id="phoneFields"><label>Pays<select name="pays" data-countries required></select></label><label>Numéro local<input name="telephone" inputmode="numeric"></label></div><div id="emailField" hidden><label>Email<input name="email" type="email"></label></div><label>Mot de passe<input name="password" type="password" required></label><p class="error"></p><button class="button">Se connecter</button><a class="muted" href="#" onclick="alert('Bientôt disponible');return false">J'ai oublié mon mot de passe</a></form><a class="muted" href="/inscription.html">Créer un compte</a></main><script src="/app.js"></script><script>mode.onchange=()=>{phoneFields.hidden=mode.value==='email';emailField.hidden=mode.value!=='email'};form.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(form));if(mode.value==='email')delete x.telephone;else delete x.email;await api('/api/auth/login',{method:'POST',body:JSON.stringify(x)});location='/portefeuille.html'}catch(e){showError(e)}}</script></body></html>
